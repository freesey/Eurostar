<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14083a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Eurostar</title>
<style>
:root{--bg:#14083a;--bg2:#1f1050;--fg:#f5f1ff;--dim:#a79bd6;--accent:#ff3d8b;--gold:#f4c95d;--cyan:#34e0d4;--paper:#fbf7ee;--ink:#1b1240;--ok:#2fd18b;--bad:#ff5a6e;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif}
body{padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 40px);
  background:radial-gradient(1200px 600px at 50% -10%,#3a1a7a55,transparent),var(--bg)}
#app{max-width:720px;margin:0 auto}
h1{font-size:30px;margin:18px 0 6px;text-align:center;letter-spacing:.04em}
h2{font-size:21px;margin:18px 0 8px}
p{line-height:1.5}
.dim{color:var(--dim)}
.sub{text-align:center;color:var(--gold);letter-spacing:.2em;font-size:13px;margin:0 0 22px}
.btn{display:block;width:100%;margin:10px 0 0;padding:15px 18px;border:0;border-radius:14px;background:var(--accent);color:#fff;font:700 18px Georgia,serif;cursor:pointer;text-align:center;text-decoration:none}
.btn.zwei{background:#ffffff1f;font-weight:400;color:var(--fg)}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.klein{display:inline-block;width:auto;padding:9px 14px;font-size:15px;margin:6px 6px 0 0;border-radius:10px}
.btn[disabled]{opacity:.35;pointer-events:none}
.reihe{display:flex;gap:8px;flex-wrap:wrap}
.reihe .btn{flex:1;min-width:120px}
.box{background:var(--bg2);border:1px solid #ffffff1a;border-radius:16px;padding:14px;margin:12px 0}
.wahl{display:flex;gap:10px}
.wahl button{flex:1;padding:14px 10px;border-radius:14px;border:2px solid #ffffff2a;background:transparent;color:var(--fg);font:16px Georgia,serif;cursor:pointer;text-align:left}
.wahl button b{display:block;font-size:18px;margin-bottom:4px}
.wahl button.an{border-color:var(--gold);background:#f4c95d1c}
input[type=text],input[type=number]{width:100%;padding:12px;border-radius:10px;border:1px solid #ffffff33;background:#0e0626;color:var(--fg);font:17px Georgia,serif}
.zeile{display:flex;gap:8px;align-items:center;margin:8px 0}
.zeile .x{flex:0 0 44px;height:44px;border-radius:10px;border:0;background:#ffffff1f;color:var(--fg);font-size:20px;cursor:pointer}
.stepper{display:flex;align-items:center;gap:12px;justify-content:center;margin:6px 0}
.stepper button{width:48px;height:48px;border-radius:12px;border:0;background:#ffffff1f;color:var(--fg);font-size:26px;cursor:pointer}
.stepper span{font-size:34px;font-weight:700;min-width:60px;text-align:center}
select{flex:1;padding:10px;border-radius:10px;border:1px solid #ffffff33;background:#0e0626;color:var(--fg);font:16px Georgia,serif}
.chk{display:flex;gap:10px;align-items:flex-start;margin:10px 0;cursor:pointer}
.chk input{width:22px;height:22px;margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{padding:6px 10px;border-radius:20px;background:#ffffff18;font-size:14px}
.chip.am{background:var(--accent);color:#fff;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top button{background:#ffffff1f;border:0;color:var(--fg);border-radius:10px;padding:8px 12px;font:15px Georgia,serif;cursor:pointer}
.dran{font-size:26px;font-weight:700;margin:4px 0}
/* Zeitstrahl */
.tl{position:relative;margin:10px 0 0 0;padding-left:0}
.k{display:flex;gap:12px;align-items:center;background:var(--paper);color:var(--ink);border-radius:12px;padding:10px 12px;margin:0;border-left:6px solid var(--accent)}
.k .j{font:700 30px/1 Georgia,serif;min-width:84px}
.k .t{flex:1;min-width:0}
.k .t b{display:block;font-size:16px;overflow-wrap:anywhere}
.k .t i{display:block;font-size:14px;overflow-wrap:anywhere}
.k .t small{display:block;color:#6b6490;font-size:12px;letter-spacing:.08em;margin-top:2px}
.k.neu{border-left-color:var(--ok);box-shadow:0 0 0 3px #2fd18b66}
.k.schlecht{border-left-color:var(--bad);box-shadow:0 0 0 3px #ff5a6e66}
.slot{display:block;width:100%;margin:5px 0;padding:11px;border:2px dashed #ffffff44;border-radius:12px;background:transparent;color:var(--dim);font:15px Georgia,serif;cursor:pointer}
.slot.an{border:2px solid var(--accent);background:var(--accent);color:#fff;font-weight:700}
.rand{text-align:center;color:var(--dim);font-size:13px;letter-spacing:.12em;margin:8px 0 2px}
.geheim{background:linear-gradient(135deg,#2a1470,#14083a);border:2px solid var(--gold);border-radius:18px;padding:16px;text-align:center}
.geheim .q{font:700 54px/1 Georgia,serif;color:var(--gold)}
.play{width:92px;height:92px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:38px;cursor:pointer;margin:12px auto 6px;display:block}
.bar{height:6px;background:#ffffff22;border-radius:4px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;width:0;background:var(--cyan)}
.fakten{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.fakten button{padding:13px 8px;border-radius:12px;border:2px solid #ffffff33;background:transparent;color:var(--fg);font:16px Georgia,serif;cursor:pointer}
.fakten button.an{border-color:var(--ok);background:#2fd18b2a;font-weight:700}
.gross{font:700 60px/1.1 Georgia,serif;text-align:center}
.urteil{padding:14px;border-radius:14px;text-align:center;font-size:20px;font-weight:700;margin:12px 0}
.urteil.ok{background:#2fd18b2a;color:var(--ok)}
.urteil.bad{background:#ff5a6e2a;color:var(--bad)}
table{width:100%;border-collapse:collapse}
td,th{padding:9px 6px;text-align:left;border-bottom:1px solid #ffffff1a}
td.r,th.r{text-align:right}
details{margin:10px 0;color:var(--dim)}
summary{cursor:pointer}
a{color:var(--gold)}
/* Modal + Scanner */
.modal{position:fixed;inset:0;background:#000000b0;display:none;align-items:center;justify-content:center;padding:18px;z-index:30}
.modal.show{display:flex}
.modal .in{background:var(--bg2);border-radius:18px;padding:18px;width:100%;max-width:420px;border:1px solid #ffffff22}
#scan{position:fixed;inset:0;background:#000;z-index:40;display:none}
#scan.show{display:block}
#scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#scan .rahmen{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(70vw,60vh,340px);aspect-ratio:1;border:3px solid var(--gold);border-radius:22px;box-shadow:0 0 0 100vmax #14083ab8}
#scan .txt{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);text-align:center;padding:0 20px;font-size:18px;text-shadow:0 1px 6px #000}
#scan .zu{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
.sp{position:fixed;right:0;bottom:0;width:300px;height:80px;opacity:.02;pointer-events:none;z-index:-1}
.sp.sichtbar{opacity:1;pointer-events:auto;z-index:20;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);right:8px}
</style>
</head>

    if (BY_ID[p.zeitstrahl[0]].nr < BY_ID[spieler[best].zeitstrahl[0]].nr) best = i;
  });
  return best;
}
function zaehleFakten(f){ return (f.song?1:0) + (f.interpret?1:0) + (f.jahr?1:0) + (f.land?1:0); }
// Gewinner bestimmen. Zeitstrahl: meiste Karten (mind. Ziel), Punkte: meiste Punkte.
function ranking(G){
  var liste = G.spieler.map(function(p, i){
    return {i:i, name:p.name, wert: G.modus === 'zeit' ? p.zeitstrahl.length : p.punkte, abgelegt:p.abgelegt, karten:p.zeitstrahl.length, punkte:p.punkte};
  });
  liste.sort(function(a, b){ return b.wert - a.wert || a.abgelegt - b.abgelegt; });
  var top = liste[0].wert, topAbg = liste[0].abgelegt;
  liste.forEach(function(e){ e.sieger = (e.wert === top) && (G.modus === 'punkte' || e.wert >= G.ziel); });
  return liste;
}
// Songauswahl: Jahre, nur Finale, beste Platzierungen. f = {von, bis, nurFinale, top}
function inAuswahl(s, f){
  if (!f) return true;
  if (s.jahr < f.von || s.jahr > f.bis) return false;
  if (f.nurFinale && !s.fin) return false;
  if (f.top > 0 && !(s.fin && s.platz > 0 && s.platz <= f.top)) return false;
  return true;
}

function zufallsKarte(benutzt){
  var frei = SONGS.filter(function(s){ return benutzt.indexOf(s.id) < 0 && inAuswahl(s, FILTER); });
  if (!frei.length) return null;
  return frei[Math.floor(Math.random() * frei.length)].id;
}

var scanLauf = 0, scanStream = null, scanCb = null, jsqrReady = false, detector = null;
var cv = document.createElement('canvas'), cx = cv.getContext('2d', {willReadFrequently:true});
(function(){
  function lade(urls){
    if (typeof jsQR === 'function'){ jsqrReady = true; return; }
    var u = urls.shift(); if (!u) return;
    var sc = document.createElement('script'); sc.src = u;
    sc.onload = function(){ jsqrReady = (typeof jsQR === 'function'); if (!jsqrReady) lade(urls); };
    sc.onerror = function(){ lade(urls); };
    document.head.appendChild(sc);
  }
  lade(['https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js','https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js','https://unpkg.com/jsqr@1.4.0/dist/jsQR.js']);
  if ('BarcodeDetector' in window){ try { detector = new BarcodeDetector({formats:['qr_code']}); } catch(e){ detector = null; } }
})();
function holeId(text){
  var id = null;
  try { id = new URL(text).searchParams.get('id'); } catch(e){}
  if (!id){ var m = /track\/([A-Za-z0-9]{22})/.exec(text); if (m) id = m[1]; }
  return (id && /^[A-Za-z0-9]{22}$/.test(id)) ? id : null;
}
function scanStop(){
  scanLauf++;
  if (scanStream){ scanStream.getTracks().forEach(function(t){ t.stop(); }); scanStream = null; }
  try { $('video').pause(); } catch(e){}
  $('video').srcObject = null;
  $('scan').classList.remove('show');
}
function scanStart(cb){
  scanCb = cb; scanStop();
  var mein = scanLauf, t = $('scanTxt');
  $('scan').classList.add('show'); t.textContent = 'Kamera wird gestartet …';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ t.textContent = 'Kein Kamerazugriff möglich. Nutze „Nr. eingeben“.'; return; }
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}}, audio:false}).then(function(s){
    if (mein !== scanLauf){ s.getTracks().forEach(function(x){ x.stop(); }); return Promise.reject('alt'); }
    scanStream = s; $('video').srcObject = s; return $('video').play();
  }).then(function(){
    if (mein !== scanLauf) return;
    t.textContent = 'Halte den QR-Code der Karte in den Rahmen';
    var ticks = 0, last = 0;
    (function loop(ts){
      if (mein !== scanLauf) return;
      var v = $('video');
      if (ts - last > 120 && v.readyState >= 2 && v.videoWidth){
        last = ts; ticks++;
        var w = v.videoWidth, h = v.videoHeight;
        if (detector) detector.detect(v).then(function(c){ if (c && c.length) treffer(c[0].rawValue); }).catch(function(){});
        if (jsqrReady){
          var sx = 0, sy = 0, sw = w, sh = h, mx = 1280;
          if (ticks % 2 === 0){ var k = Math.round(Math.min(w, h) * 0.8); sx = Math.round((w-k)/2); sy = Math.round((h-k)/2); sw = k; sh = k; mx = 900; }
          var f = Math.min(1, mx / Math.max(sw, sh));
          cv.width = Math.round(sw*f); cv.height = Math.round(sh*f);
          cx.drawImage(v, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
          var d = cx.getImageData(0, 0, cv.width, cv.height);
          var r = jsQR(d.data, d.width, d.height, {inversionAttempts:'dontInvert'});
          if (r && r.data) treffer(r.data);
        }
      }
      requestAnimationFrame(loop);
    })(0);
    function treffer(text){
      if (mein !== scanLauf) return;
      var id = holeId(text);
      if (!id || !BY_ID[id]){ t.textContent = id ? 'Diese Karte ist nicht in der Liste' : 'Das ist keine Karte aus diesem Spiel'; return; }
      var cb2 = scanCb; scanStop(); if (navigator.vibrate) navigator.vibrate(60); cb2(id);
    }
  }).catch(function(e){
    if (e === 'alt' || mein !== scanLauf) return;
    t.textContent = 'Kein Zugriff auf die Kamera. Erlaube sie im Browser oder nutze „Nr. eingeben“.';
  });
}
$('scanZu').onclick = scanStop;
document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'hidden') scanStop(); });

/* ===================== SPOTIFY-PLAYER ===================== */
var sp = {api:null, ctrl:null, pending:null, spielt:false, anteil:0, text:''};
window.onSpotifyIframeApiReady = function(api){
  sp.api = api;
  api.createController($('spPlayer'), {uri:'spotify:track:' + (sp.pending || '0bhe4GXAZsKViKVO4MHsFR'), width:300, height:80}, function(c){
    sp.ctrl = c;
    c.addListener('playback_update', function(e){
      var d = e.data || {}; sp.spielt = !d.isPaused && !d.isBuffering;
      var b = $('playBtn'), bar = $('playBar'), tx = $('playTxt');
      if (d.duration) sp.anteil = Math.min(100, d.position / d.duration * 100);
      sp.text = sp.spielt ? 'Es läuft …' : (d.position > 0 ? 'Pausiert' : 'Tippe zum Abspielen');
      if (b) b.textContent = sp.spielt ? '❚❚' : '▶';
      if (bar) bar.style.width = sp.anteil + '%';
      if (tx) tx.textContent = sp.text;
    });
  });
};
(function(){ var s = document.createElement('script'); s.src = 'https://open.spotify.com/embed/iframe-api/v1'; s.async = true; document.body.appendChild(s); })();
function songLaden(id){
  sp.pending = id; sp.spielt = false; sp.anteil = 0; sp.text = '';
  $('spBox').classList.remove('sichtbar');
  if (sp.ctrl){ try { sp.ctrl.loadUri('spotify:track:' + id); } catch(e){} }
}
function songStop(){ if (sp.ctrl){ try { sp.ctrl.pause(); } catch(e){} } sp.spielt = false; }
function playKlick(){
  if (!sp.ctrl){ $('playTxt').textContent = 'Player lädt noch … gleich nochmal tippen (oder „In Spotify öffnen“).'; return; }
  try { if (sp.spielt) sp.ctrl.pause(); else sp.ctrl.togglePlay(); } catch(e){}
}

/* ===================== SPIELABLAUF ===================== */
function neueKarte(id){
  if (FILTER && !inAuswahl(BY_ID[id], FILTER) && !confirm('Diese Karte liegt außerhalb der gewählten Songauswahl. Trotzdem verwenden?')) return false;
  if (G.benutzt.indexOf(id) >= 0 && !confirm('Diese Karte wurde in dieser Runde schon gespielt. Trotzdem verwenden?')) return false;
  if (G.benutzt.indexOf(id) < 0) G.benutzt.push(id);
  return true;
}
function startkarteSetzen(i, id){
  var p = G.spieler[i];
  if (p.zeitstrahl && p.zeitstrahl.length){ var alt = G.benutzt.indexOf(p.zeitstrahl[0]); if (alt >= 0) G.benutzt.splice(alt, 1); }
  if (!neueKarte(id)) return;
  p.zeitstrahl = [id]; speichern(); render();
}
function karteZiehen(id){
  if (!neueKarte(id)) return;
  G.karte = {id:id, slot:null, zeigen:false, fakten:{song:false, interpret:false, jahr:false, land:false}};
  songLaden(id); speichern(); render();
}
function loesen(){
  var p = G.spieler[G.aktuell], k = G.karte;
  G.sicherung = JSON.stringify({spieler:G.spieler, benutzt:G.benutzt, ablage:G.ablage, aktuell:G.aktuell, karte:G.karte});
  var ok = platzKorrekt(p.zeitstrahl, k.slot, k.id), fakten = 0, pts = 0, eingefuegt = false;
  if (G.modus === 'punkte'){
    fakten = zaehleFakten(k.fakten); pts = fakten + (ok ? 1 : 0); p.punkte += pts;
    p.zeitstrahl = sortiertEinfuegen(p.zeitstrahl, k.id); eingefuegt = true;
  } else if (ok){ p.zeitstrahl = sortiertEinfuegen(p.zeitstrahl, k.id); eingefuegt = true; }
  else { G.ablage.push(k.id); p.abgelegt++; }
  p.gespielt++;
  G.letztes = {spieler:G.aktuell, id:k.id, ok:ok, pts:pts, fakten:fakten, eingefuegt:eingefuegt};
  G.karte = null; songStop();
  ansicht('ergebnis');
}
function zugZurueck(){
  if (!G.sicherung) return;
  if (!confirm('Den letzten Zug zurücknehmen? Die Karte wird wieder offen vor dem Spieler liegen.')) return;
  var z = JSON.parse(G.sicherung);
  G.spieler = z.spieler; G.benutzt = z.benutzt; G.ablage = z.ablage; G.aktuell = z.aktuell; G.karte = z.karte;
  G.letztes = null; G.sicherung = null;
  if (G.karte) songLaden(G.karte.id);
  ansicht('zug');
}
function weiter(){
  var next = (G.aktuell + 1) % G.spieler.length, fertig = false;
  if (G.modus === 'zeit'){
    var erreicht = G.spieler.some(function(p){ return p.zeitstrahl.length >= G.ziel; });
    var rundeEnde = next === G.startIndex;
    fertig = erreicht && (!G.rundeFertig || rundeEnde);
  } else {
    fertig = G.spieler.every(function(p){ return p.gespielt >= G.proSpieler; });
  }
  if (fertig){ ansicht('ende'); return; }
  G.aktuell = next; G.karte = null; ansicht('zug');
}
function menuDialog(){
  modal('<b style="font-size:19px">Menü</b>' +
        '<button class="btn zwei" id="mRegeln">Spielregeln anzeigen</button>' +
        '<button class="btn zwei" id="mEnde">Spiel beenden und zum Menü</button>' +
        '<button class="btn" id="mZu">Weiterspielen</button>');
  $('mZu').onclick = modalZu;
  $('mRegeln').onclick = function(){ modal('<div style="max-height:70vh;overflow:auto">' + viewRegeln().replace(/<div class="top">.*?<\/div>/, '') + '</div><button class="btn" id="mZu2">Schließen</button>'); $('mZu2').onclick = modalZu; };
  $('mEnde').onclick = function(){ if (confirm('Spiel wirklich beenden? Der Spielstand geht verloren.')){ modalZu(); songStop(); G = null; loeschen(); ansicht('menu'); } };
}

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b || b.tagName === 'INPUT') return;
  var a = b.dataset.act, i = parseInt(b.dataset.i, 10);
  switch (a){
    case 'neu': G = neuesSpiel(); ansicht('setup'); break;
    case 'fortsetzen': var s = laden(); if (s){ G = s.G; ANSICHT = s.ANSICHT; FILTER = G.filter || null; if (!G.filter) G.filter = {von:1956, bis:2026, nurFinale:false, top:0}; if (G.karte) songLaden(G.karte.id); render(); } break;
    case 'regeln': ansicht('regeln'); break;
    case 'menu': ansicht('menu'); break;
    case 'modus': G.modus = b.dataset.m; render(); break;
    case 'ziel': var d = parseInt(b.dataset.d, 10);
      if (G.modus === 'zeit') G.ziel = Math.max(3, Math.min(30, G.ziel + d)); else G.proSpieler = Math.max(1, Math.min(30, G.proSpieler + d)); render(); break;
    case 'addp': G.spieler.push({name:'Spieler ' + (G.spieler.length + 1)}); render(); break;
    case 'delp': G.spieler.splice(i, 1); render(); break;
    case 'zuStart':
      G.spieler = G.spieler.map(function(p, n){ return {name:(p.name || '').trim() || 'Spieler ' + (n + 1), zeitstrahl:[], punkte:0, gespielt:0, abgelegt:0}; });
      G.benutzt = []; G.ablage = []; G.sicherung = null; FILTER = G.filter; ansicht('start'); break;
    case 'zurSetup': G.spieler = G.spieler.map(function(p){ return {name:p.name}; }); ansicht('setup'); break;
    case 'startScan': scanStart(function(id){ startkarteSetzen(i, id); }); break;
    case 'startNr': nrDialog(function(id){ startkarteSetzen(i, id); }); break;
    case 'startZufall': var z = zufallsKarte(G.benutzt); if (z) startkarteSetzen(i, z); break;
    case 'alleZufall': G.spieler.forEach(function(p, n){ if (!p.zeitstrahl.length){ var z2 = zufallsKarte(G.benutzt); if (z2){ G.benutzt.push(z2); p.zeitstrahl = [z2]; } } }); speichern(); render(); break;
    case 'los': G.startIndex = startSpieler(G.spieler); G.aktuell = G.startIndex; G.karte = null; ansicht('zug'); break;
    case 'zugScan': scanStart(karteZiehen); break;
    case 'zugNr': nrDialog(karteZiehen); break;
    case 'zugZufall': var z3 = zufallsKarte(G.benutzt); if (z3) karteZiehen(z3); break;
    case 'slot': G.karte.slot = i; speichern(); render(); break;
    case 'fakt': G.karte.fakten[b.dataset.f] = !G.karte.fakten[b.dataset.f]; speichern(); render(); break;
    case 'zeigen': G.karte.zeigen = !G.karte.zeigen; speichern(); render(); break;
    case 'play': playKlick(); break;
    case 'vonVorn': if (sp.ctrl){ try { sp.ctrl.restart(); } catch(e){ try { sp.ctrl.seek(0); sp.ctrl.play(); } catch(e2){} } } break;
    case 'playerZeigen': $('spBox').classList.toggle('sichtbar'); break;
    case 'loesen': loesen(); break;
    case 'verwerfen': var idx = G.benutzt.indexOf(G.karte.id); if (idx >= 0) G.benutzt.splice(idx, 1); G.karte = null; songStop(); speichern(); render(); break;
    case 'weiter': weiter(); break;
    case 'zurueck': zugZurueck(); break;
    case 'menuDlg': menuDialog(); break;
  }
});
document.addEventListener('input', function(e){
  var t = e.target;
  if (t.classList && t.classList.contains('pname')) G.spieler[parseInt(t.dataset.i, 10)].name = t.value;
});
document.addEventListener('change', function(e){
  var d = e.target.dataset || {};
  if (d.act === 'runde') G.rundeFertig = e.target.checked;
  if (d.filter){
    var f = G.filter;
    if (d.filter === 'nurFinale') f.nurFinale = e.target.checked;
    else f[d.filter] = parseInt(e.target.value, 10);
    if (f.von > f.bis){ if (d.filter === 'von') f.bis = f.von; else f.von = f.bis; }
    render();
  }
});

/* ===================== SONGLISTE AUS DER EXCEL LADEN ===================== */
// Liegt "esc_songs_komplett.xlsx" im selben Ordner wie diese Seite (z. B. im GitHub-Repository),
// wird sie beim Öffnen gelesen. So reicht es, die Excel-Datei auszutauschen.
var EXCEL_DATEI = 'esc_songs_komplett.xlsx';
function skriptLaden(urls){
  return new Promise(function(ok, fail){
    if (typeof XLSX !== 'undefined') return ok();
    var u = urls.shift(); if (!u) return fail();
    var sc = document.createElement('script'); sc.src = u;
    sc.onload = function(){ typeof XLSX !== 'undefined' ? ok() : skriptLaden(urls).then(ok, fail); };
    sc.onerror = function(){ skriptLaden(urls).then(ok, fail); };
    document.head.appendChild(sc);
  });
}
function excelLaden(){
  if (location.protocol === 'file:') return Promise.reject('lokal');
  return skriptLaden(['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js','https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'])
    .then(function(){ return fetch(EXCEL_DATEI + '?v=' + Date.now(), {cache:'no-store'}); })
    .then(function(r){ if (!r.ok) throw 'nicht gefunden'; return r.arrayBuffer(); })
    .then(function(buf){
      var wb = XLSX.read(buf, {type:'array'});
      var zeilen = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:''});
      var neu = [];
      zeilen.forEach(function(z){
        var id = String(z['Spotify-ID'] || '').trim(), t = String(z['Treffer'] || '').trim().toLowerCase();
        var nr = parseInt(z['Nr'], 10), jahr = parseInt(z['Jahr'], 10);
        if (!/^[A-Za-z0-9]{22}$/.test(id) || t === 'gelöscht' || t === 'unsicher' || !nr || !jahr) return;
        var pl = parseInt(z['Platz im Jahr'], 10) || 0, fi = /^\d+$/.test(String(z['Platz Finale']).trim()) ? 1 : 0;
        neu.push([id, nr, jahr, String(z['Land']).trim(), String(z['Interpret']).trim(), String(z['Titel']).trim(), pl, fi]);
      });
      if (neu.length < 100) throw 'Datei unvollständig';
      baueIndex(neu, SONGS.slice());
      DATA_INFO = 'Songliste aus der Excel geladen';
    });
}

ANSICHT = 'menu';
DATA_INFO = location.protocol === 'file:' ? 'eingebaute Songliste (lokal geöffnet)' : 'Songliste wird aktualisiert …';
render();
excelLaden().catch(function(){ DATA_INFO = 'eingebaute Songliste (Excel nicht erreichbar)'; }).then(function(){ if (ANSICHT === 'menu') render(); });
